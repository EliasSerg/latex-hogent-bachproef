#cloud-config
# link-emulator-user-data.yaml
# Rol: emuleert de 5.6~GHz airMAX-straalverbinding (zie Sectie
# sec:virtuele-simulatie-airmax) door de twee "radiolink"-interfaces te
# overbruggen (L2-bridge) en er per richting een netem-qdisc op toe te passen.

hostname: poc-link-emulator
manage_etc_hosts: true

users:
  - name: poc
    groups: [sudo]
    shell: /bin/bash
    lock_passwd: false
    plain_text_passwd: "poc"
    sudo: "ALL=(ALL) NOPASSWD:ALL"
    ssh_authorized_keys:
      - __SSH_PUBLIC_KEY__

ssh_pwauth: true

package_update: true
packages:
  - openssh-server
  - iproute2
  - bc

write_files:
  - path: /usr/local/bin/configure-network.sh
    permissions: "0755"
    content: |
      #!/usr/bin/env bash
      set -euo pipefail
      MODE="$1"

      # Vlak na het opstarten heeft de kernel niet altijd alle netwerk-
      # kaarten al klaar staan. "bridge" heeft er 3 nodig (beheer + twee
      # linksegmenten), "host" volstaat met 2 (beheer + één linksegment).
      # In plaats van blind verder te gaan met te weinig interfaces (met
      # als gevolg een lege interfacenaam in de netplan-configuratie en een
      # configure-network.sh dat vroegtijdig afbreekt, vóór het het
      # /etc/poc-ifaces.env-bestand kan wegschrijven), wordt hier expliciet
      # gewacht tot ze er echt zijn.
      count_ifaces() {
          local n=0
          for _f in /sys/class/net/*; do
              [ "$(basename "$_f")" = "lo" ] && continue
              n=$((n + 1))
          done
          echo "$n"
      }
      if [ "$MODE" = "bridge" ]; then NEEDED=3; else NEEDED=2; fi
      WAITED=0
      while [ "$(count_ifaces)" -lt "$NEEDED" ]; do
          if [ "$WAITED" -ge 30 ]; then
              echo "configure-network.sh: te weinig netwerkinterfaces na 30s, ga toch verder" >&2
              break
          fi
          sleep 1
          WAITED=$((WAITED + 1))
      done

      IFACES=()
      for _f in /sys/class/net/*; do
          _name="$(basename "$_f")"
          [ "$_name" = "lo" ] && continue
          IFACES+=("$_name")
      done
      IFS=$'\n' IFACES=($(sort <<<"${IFACES[*]}")); unset IFS
      # Let op: het beheersinterface (IFACES[0], NAT) wordt HIER BEWUST NIET
      # geconfigureerd. Cloud-init's eigen standaard-netplanbestand regelt
      # DHCP daarop al correct; het opnieuw declareren ervan in dit tweede
      # netplanbestand kan bij "netplan apply" een korte (of soms blijvende)
      # onderbreking van net die verbinding veroorzaken -- exact het SSH-pad
      # dat de host gebruikt om met deze VM te praten.
      LINK_A_IF="${IFACES[1]:-}"
      LINK_B_IF="${IFACES[2]:-}"

      if [ "$MODE" = "host" ]; then
          ADDR="$2"
          cat > /etc/netplan/60-poc.yaml <<NETPLAN
      network:
        version: 2
        ethernets:
          ${LINK_A_IF}:
            dhcp4: false
            addresses: [${ADDR}]
      NETPLAN
      elif [ "$MODE" = "bridge" ]; then
          cat > /etc/netplan/60-poc.yaml <<NETPLAN
      network:
        version: 2
        ethernets:
          ${LINK_A_IF}:
            dhcp4: false
          ${LINK_B_IF}:
            dhcp4: false
        bridges:
          br0:
            interfaces: [${LINK_A_IF}, ${LINK_B_IF}]
            dhcp4: false
            parameters:
              stp: false
              forward-delay: 0
      NETPLAN
          {
            echo "export LINK_A_IF=${LINK_A_IF}"
            echo "export LINK_B_IF=${LINK_B_IF}"
          } > /etc/poc-ifaces.env
      fi
      chmod 600 /etc/netplan/60-poc.yaml
      netplan apply

  - path: /etc/sysctl.d/99-poc-bridge.conf
    permissions: "0644"
    content: |
      # Vermijd dat de (transparante) bridge-verkeersstroom onbedoeld door de
      # iptables/netfilter-regels van de host-VM wordt gefilterd. Zonder dit
      # kan br_netfilter het "onzichtbare" karakter van de link verstoren.
      net.bridge.bridge-nf-call-iptables=0
      net.bridge.bridge-nf-call-ip6tables=0

  - path: /usr/local/bin/poc-set-scenario.sh
    permissions: "0755"
    content: |
      #!/usr/bin/env bash
      # Stelt de VASTE basistoestand in voor één van de drie afstandscategorieën
      # uit Sectie sec:req-tussentijdse-conclusie (geen weer/DFS-variatie -- dat
      # zit in poc-run-trial.sh, voor de statistische batchtests).
      set -euo pipefail
      # shellcheck source=/etc/poc-ifaces.env
      source /etc/poc-ifaces.env

      DISTANCE="${1:-0-15}"

      apply() {
          local iface="$1" delay="$2" jitter="$3" loss="$4" rate="$5"
          tc qdisc replace dev "${iface}" root netem \
              delay "${delay}" "${jitter}" distribution normal \
              loss "${loss}" \
              rate "${rate}"
      }

      case "${DISTANCE}" in
        0-15)
          apply "${LINK_A_IF}" 12ms 2ms 0.1% 150mbit
          apply "${LINK_B_IF}" 12ms 2ms 0.1% 150mbit
          ;;
        15-30)
          apply "${LINK_A_IF}" 22ms 3ms 1.5% 35mbit
          apply "${LINK_B_IF}" 22ms 3ms 1.5% 35mbit
          ;;
        30+)
          apply "${LINK_A_IF}" 35ms 5ms 5% 5mbit
          apply "${LINK_B_IF}" 35ms 5ms 5% 5mbit
          ;;
        *)
          echo "Onbekende afstandscategorie: ${DISTANCE} (verwacht: 0-15|15-30|30+)" >&2
          exit 1
          ;;
      esac
      echo "Afstandscategorie '${DISTANCE}' actief op ${LINK_A_IF} en ${LINK_B_IF}."

  - path: /usr/local/bin/poc-run-trial.sh
    permissions: "0755"
    content: |
      #!/usr/bin/env bash
      # Eén trial voor de statistische batchtests (Sectie sec:sim-trials): past
      # de basisparameters van de gevraagde afstandscategorie toe, maar met
      # willekeurige weersvariatie (Gilbert-Elliot burstverliesmodel + jitter op
      # delay/rate) en een kans op een DFS-onderbreking -- op ELKE afstand,
      # zoals vereist. Bedoeld om via SSH honderden keren na elkaar aangeroepen
      # te worden door Run-DistanceTrials.ps1 op de host.
      set -euo pipefail
      # shellcheck source=/etc/poc-ifaces.env
      source /etc/poc-ifaces.env

      DISTANCE="${1:-0-15}"

      case "${DISTANCE}" in
        0-15)  D=12; J=2; RATE=150; LOSS_GOED=0.1; LOSS_SLECHT=8;  P_G2B_LO=1; P_G2B_HI=2;  P_B2G_LO=50; P_B2G_HI=70 ;;
        15-30) D=22; J=3; RATE=35;  LOSS_GOED=1.5; LOSS_SLECHT=20; P_G2B_LO=2; P_G2B_HI=4;  P_B2G_LO=30; P_B2G_HI=50 ;;
        30+)   D=35; J=5; RATE=5;   LOSS_GOED=5;   LOSS_SLECHT=40; P_G2B_LO=4; P_G2B_HI=8;  P_B2G_LO=20; P_B2G_HI=40 ;;
        *) echo "Onbekende afstandscategorie: ${DISTANCE}" >&2; exit 1 ;;
      esac

      # rand_range MIN MAX -> willekeurig float-getal in [MIN,MAX], met een
      # unieke seed per aanroep (bash $RANDOM + PID) zodat opeenvolgende
      # aanroepen binnen dezelfde seconde niet dezelfde waarde teruggeven.
      rand_range() {
          awk -v seed="$RANDOM$RANDOM$$" -v lo="$1" -v hi="$2" \
              'BEGIN{srand(seed); printf "%.2f", lo + rand()*(hi-lo)}'
      }

      # Willekeurige weersvariatie: +/-30% op delay, +/-25% op rate, en
      # Gilbert-Elliot-burstparameters binnen de bandbreedte van deze
      # afstandscategorie (zie sim-verantwoording voor de motivatie).
      DELAY=$(rand_range "$(echo "$D*0.7" | bc)" "$(echo "$D*1.3" | bc)")
      NEW_RATE=$(rand_range "$(echo "$RATE*0.75" | bc)" "$(echo "$RATE*1.25" | bc)")
      P_G2B=$(rand_range "$P_G2B_LO" "$P_G2B_HI")
      P_B2G=$(rand_range "$P_B2G_LO" "$P_B2G_HI")

      for IFACE in "${LINK_A_IF}" "${LINK_B_IF}"; do
          tc qdisc replace dev "${IFACE}" root netem \
              delay "${DELAY}ms" "${J}ms" distribution normal \
              loss gemodel "${P_G2B}%" "${P_B2G}%" "${LOSS_SLECHT}%" "${LOSS_GOED}%" \
              rate "${NEW_RATE}mbit"
      done

      # DFS: op elke afstand een kans van 8% dat er ergens in het
      # meetvenster van deze trial een radardetectie optreedt (EN~301~893,
      # zie subsec:dfs) -- onafhankelijk van de afstandscategorie, precies
      # zoals vereist.
      DFS_ROLL=$(( RANDOM % 100 ))
      DFS_THIS_TRIAL="nee"
      if [ "${DFS_ROLL}" -lt 8 ]; then
          DFS_THIS_TRIAL="ja"
          DFS_START=$(( RANDOM % 8 ))
          (
              sleep "${DFS_START}"
              tc qdisc change dev "${LINK_A_IF}" root netem loss 100%
              tc qdisc change dev "${LINK_B_IF}" root netem loss 100%
              sleep 10
              tc qdisc replace dev "${LINK_A_IF}" root netem \
                  delay "${DELAY}ms" "${J}ms" distribution normal \
                  loss gemodel "${P_G2B}%" "${P_B2G}%" "${LOSS_SLECHT}%" "${LOSS_GOED}%" rate "${NEW_RATE}mbit"
              tc qdisc replace dev "${LINK_B_IF}" root netem \
                  delay "${DELAY}ms" "${J}ms" distribution normal \
                  loss gemodel "${P_G2B}%" "${P_B2G}%" "${LOSS_SLECHT}%" "${LOSS_GOED}%" rate "${NEW_RATE}mbit"
          ) </dev/null >/tmp/poc-dfs-event.log 2>&1 &
          disown
      fi

      echo "trial distance=${DISTANCE} delay=${DELAY}ms rate=${NEW_RATE}mbit p_g2b=${P_G2B}% p_b2g=${P_B2G}% dfs=${DFS_THIS_TRIAL}"

  - path: /etc/systemd/system/poc-scenario-default.service
    permissions: "0644"
    content: |
      [Unit]
      Description=Stel de standaard afstandscategorie in bij het opstarten (REQ-01..03)
      After=network-online.target
      Wants=network-online.target

      [Service]
      Type=oneshot
      ExecStart=/usr/local/bin/poc-set-scenario.sh 0-15
      RemainAfterExit=true

      [Install]
      WantedBy=multi-user.target

runcmd:
  - /usr/local/bin/configure-network.sh bridge
  - sysctl --system
  - systemctl daemon-reload
  - systemctl enable --now poc-scenario-default.service
