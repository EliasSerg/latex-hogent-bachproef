#cloud-config
# client-user-data.yaml
# Rol: SFTP-client die de metingen en bestandsoverdrachten uitvoert
# (FR-01, FR-02, REQ-01..03).

hostname: poc-client
manage_etc_hosts: true

users:
  - name: poc
    groups: [sudo]
    shell: /bin/bash
    lock_passwd: false
    plain_text_passwd: "poc"
    sudo: "ALL=(ALL) NOPASSWD:ALL"
    ssh_authorized_keys:
      - __SSH_PUBLIC_KEY__

ssh_pwauth: true

package_update: true
packages:
  - openssh-server
  - openssh-client
  - iperf3
  - mtr-tiny
  - sshpass

write_files:
  - path: /usr/local/bin/configure-network.sh
    permissions: "0755"
    content: |
      #!/usr/bin/env bash
      set -euo pipefail
      MODE="$1"

      # Vlak na het opstarten heeft de kernel niet altijd alle netwerk-
      # kaarten al klaar staan. "bridge" heeft er 3 nodig (beheer + twee
      # linksegmenten), "host" volstaat met 2 (beheer + één linksegment).
      # In plaats van blind verder te gaan met te weinig interfaces (met
      # als gevolg een lege interfacenaam in de netplan-configuratie en een
      # configure-network.sh dat vroegtijdig afbreekt, vóór het het
      # /etc/poc-ifaces.env-bestand kan wegschrijven), wordt hier expliciet
      # gewacht tot ze er echt zijn.
      count_ifaces() {
          local n=0
          for _f in /sys/class/net/*; do
              [ "$(basename "$_f")" = "lo" ] && continue
              n=$((n + 1))
          done
          echo "$n"
      }
      if [ "$MODE" = "bridge" ]; then NEEDED=3; else NEEDED=2; fi
      WAITED=0
      while [ "$(count_ifaces)" -lt "$NEEDED" ]; do
          if [ "$WAITED" -ge 30 ]; then
              echo "configure-network.sh: te weinig netwerkinterfaces na 30s, ga toch verder" >&2
              break
          fi
          sleep 1
          WAITED=$((WAITED + 1))
      done

      IFACES=()
      for _f in /sys/class/net/*; do
          _name="$(basename "$_f")"
          [ "$_name" = "lo" ] && continue
          IFACES+=("$_name")
      done
      IFS=$'\n' IFACES=($(sort <<<"${IFACES[*]}")); unset IFS
      # Let op: het beheersinterface (IFACES[0], NAT) wordt HIER BEWUST NIET
      # geconfigureerd. Cloud-init's eigen standaard-netplanbestand regelt
      # DHCP daarop al correct; het opnieuw declareren ervan in dit tweede
      # netplanbestand kan bij "netplan apply" een korte (of soms blijvende)
      # onderbreking van net die verbinding veroorzaken -- exact het SSH-pad
      # dat de host gebruikt om met deze VM te praten.
      LINK_A_IF="${IFACES[1]:-}"
      LINK_B_IF="${IFACES[2]:-}"

      if [ "$MODE" = "host" ]; then
          ADDR="$2"
          cat > /etc/netplan/60-poc.yaml <<NETPLAN
      network:
        version: 2
        ethernets:
          ${LINK_A_IF}:
            dhcp4: false
            addresses: [${ADDR}]
      NETPLAN
      elif [ "$MODE" = "bridge" ]; then
          cat > /etc/netplan/60-poc.yaml <<NETPLAN
      network:
        version: 2
        ethernets:
          ${LINK_A_IF}:
            dhcp4: false
          ${LINK_B_IF}:
            dhcp4: false
        bridges:
          br0:
            interfaces: [${LINK_A_IF}, ${LINK_B_IF}]
            dhcp4: false
      NETPLAN
          {
            echo "export LINK_A_IF=${LINK_A_IF}"
            echo "export LINK_B_IF=${LINK_B_IF}"
          } > /etc/poc-ifaces.env
      fi
      chmod 600 /etc/netplan/60-poc.yaml
      netplan apply

runcmd:
  - /usr/local/bin/configure-network.sh host 10.0.0.2/24
